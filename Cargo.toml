[package]
name = "cosmic-idle"
version = "1.12.0"
edition = "2024"

[dependencies]
keyframe = "1.1.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
cosmic-config = { git = "https://github.com/pop-os/libcosmic", features = [
    "calloop",
] }
cosmic-idle-config = { path = "./cosmic-idle-config" }
cosmic-settings-config = { git = "https://github.com/pop-os/cosmic-settings-daemon" }
calloop = { version = "0.14.5", features = ["executor"] }
calloop-wayland-source = "0.4.1"
log = "0.4.35"
env_logger = "0.11.12"
upower-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
zbus = "6.5"
futures-lite = "2.6.1"

[workspace]
members = ["cosmic-idle-config"]
